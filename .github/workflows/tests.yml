name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
        working-directory: revisaviajes
      - run: python -m unittest discover -s tests
        working-directory: revisaviajes
      - run: python agent.py examples/itinerario.txt --extract-only --out demo
        working-directory: revisaviajes
